name: tinytavern

services:
  tinytavern:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-prod
    container_name: tinytavern
    user: '1000:1000'
    volumes:
      - ./data:/data
      - ./.secrets/prod:/secrets:ro
    environment:
      MEDIA_SIGNING_KEY_FILE: /secrets/media.key
      CADDY_PROXY_KEY_FILE: /secrets/proxy.key
      SESSION_COOKIE_NAME: tinytavern_prod_session
      TINYTAVERN_IP_ALLOWLIST: '${TINYTAVERN_IP_ALLOWLIST-}'
    restart: unless-stopped
    # Separate network for ComfyUI; optionally reuse an external network via .env.
    networks:
      - default
      - comfy

  caddy-prod:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      target: caddy-prod
    user: '1000:1000'
    ports:
      - '5487:5487/tcp'
      - '5487:5487/udp'
    environment:
      PUBLIC_PORT: '5487'
      BACKEND: tinytavern:5487
      TINYTAVERN_IP_ALLOWLIST: '${TINYTAVERN_IP_ALLOWLIST-}'
    volumes:
      - ./certs:/certs:ro
      - ./.secrets/prod:/secrets:ro
      - ./data/images:/media/images:ro
      - ./data/avatars:/media/avatars:ro
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    restart: unless-stopped
    depends_on:
      - tinytavern

networks:
  comfy:
    name: ${TINYTAVERN_COMFY_NETWORK:-${COMPOSE_PROJECT_NAME}_comfy}
    external: ${TINYTAVERN_COMFY_NETWORK_EXTERNAL:-false}
