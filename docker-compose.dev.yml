# Read-only overlays protect repository metadata and deployment files during hot reload.
x-dev-volumes: &dev-volumes
  volumes:
    - .:/app
    - ./.git:/app/.git:ro
    - ./Dockerfile:/app/Dockerfile:ro
    - ./docker-compose.yml:/app/docker-compose.yml:ro
    - ./docker-compose.dev.yml:/app/docker-compose.dev.yml:ro

services:
  server:
    image: node:26-alpine
    working_dir: /app
    user: "1000:1000"
    # --watch-path is more reliable than module-graph watching on bind mounts
    command: node --watch-path=server/src --watch-path=shared/src server/src/index.ts
    environment:
      DATA_DIR: /app/data-dev
      MINITAVERN_IP_ALLOWLIST: "${MINITAVERN_IP_ALLOWLIST-}"
      MEDIA_SIGNING_KEY_FILE: /app/.secrets/dev/media.key
      CADDY_PROXY_KEY_FILE: /app/.secrets/dev/proxy.key
      SESSION_COOKIE_NAME: minitavern_dev_session
    <<: *dev-volumes
    # Reach ComfyUI at http://comfy:8588 on its existing network.
    networks:
      - default
      - comfy

  client:
    image: node:26-alpine
    working_dir: /app
    user: "1000:1000"
    command: npm run dev -w client
    environment:
      CADDY_FRONTEND: "1"
      MINITAVERN_IP_ALLOWLIST: ""
    volumes:
      - .:/app
      - ./.git:/app/.git:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/app/docker-compose.dev.yml:ro
    depends_on:
      - server

  caddy-dev:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      target: caddy-dev
    user: "1000:1000"
    ports:
      - "5173:5173/tcp"
      - "5173:5173/udp"
    environment:
      PUBLIC_PORT: "5173"
      MINITAVERN_IP_ALLOWLIST: "${MINITAVERN_IP_ALLOWLIST-}"
    volumes:
      - ./certs:/certs:ro
      - ./.secrets/dev:/secrets:ro
      - ./data-dev/images:/media/images:ro
      - ./data-dev/avatars:/media/avatars:ro
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    depends_on:
      - server
      - client

  # Mock endpoint: http://mock:9800/v1 from the server. See AGENTS.md for isolated tests.
  mock:
    profiles: ["mock"]
    image: node:26-alpine
    working_dir: /app
    user: "1000:1000"
    command: node tests/mocks/server.ts
    <<: *dev-volumes
    ports:
      - "9800:9800"

networks:
  comfy:
    external: true
    name: my-bridge-network
