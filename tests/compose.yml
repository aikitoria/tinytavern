services:
  tests:
    image: tinytavern-server-dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: server-base
    init: true
    user: '1000:1000'
    working_dir: /app
    network_mode: none
    volumes:
      - ..:/app:ro
    tmpfs:
      - /tmp:mode=1777
    command: node tests/run.ts
